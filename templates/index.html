<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>罗盘</title>
<style>
  :root {
    --bg: #1a1b26;
    --panel: #24273a;
    --border: #363a4f;
    --text: #cad3f5;
    --muted: #8087a2;
    --want: #8aadf4;
    --obstacle: #ed8796;
    --node: #a6da95;
    --accent: #c6a0f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- 左侧话题栏 ---------- */
  #sidebar {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  #sidebar h1 {
    font-size: 15px;
    padding: 16px 16px 8px;
    margin: 0;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .topic-item { padding: 12px 16px; cursor: pointer; border-left: 3px solid transparent; }
  .topic-item:hover { background: rgba(255,255,255,0.04); }
  .topic-item.active { background: rgba(255,255,255,0.06); border-left-color: var(--accent); }
  .topic-name { font-size: 14px; font-weight: 500; }
  .topic-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ---------- 入口:先给项目文件夹路径,再进主界面 ---------- */
  #gate {
    position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  #gate-box { width: 420px; text-align: center; }
  #gate-title { font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  #gate-hint { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
  #gate-box input {
    width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text); font-size: 14px; margin-bottom: 12px; box-sizing: border-box;
  }
  #gate-box input:focus { outline: none; border-color: var(--accent); }
  #gate-box button {
    width: 100%; background: var(--accent); color: var(--bg); border: none; border-radius: 8px;
    padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #gate-box button:hover { opacity: 0.85; }
  #gate-box button:disabled { opacity: 0.5; cursor: default; }
  #gate-msg { font-size: 12.5px; margin-top: 12px; line-height: 1.5; min-height: 18px; }
  #gate-skip { display: block; margin-top: 16px; font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; }

  #app-shell { display: none; position: relative; flex: 1; min-width: 0; height: 100%; }

  /* ---------- 侧边栏折叠 ---------- */
  #sidebar { transition: width 0.15s ease, min-width 0.15s ease; }
  #sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; border-right: none; }
  #sidebar-toggle {
    position: absolute; top: 12px; left: 264px; z-index: 10; width: 22px; height: 22px; border-radius: 5px;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
    font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: left 0.15s ease;
  }
  #sidebar-toggle:hover { color: var(--text); }
  #sidebar-toggle.collapsed-pos { left: 6px; }
  #switch-project {
    font-size: 11px; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0 16px 10px;
    display: block;
  }
  #switch-project:hover { color: var(--text); }
  #filter-bar {
    margin: 0 16px 10px; padding: 8px 10px; background: rgba(166,218,149,0.08);
    border: 1px solid rgba(166,218,149,0.25); border-radius: 6px;
  }
  #filter-path {
    font-size: 11.5px; color: var(--node); font-weight: 600; margin-bottom: 4px;
    overflow-wrap: break-word;
  }
  #show-all-topics { font-size: 11px; color: var(--muted); cursor: pointer; text-decoration: underline; }
  #show-all-topics:hover { color: var(--text); }
  #topic-list-empty { padding: 16px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }

  #new-project-box { padding: 16px; border-bottom: 1px solid var(--border); background: rgba(198,160,246,0.05); }
  .np-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .np-hint { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  #new-project-box input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; color: var(--text); font-size: 12.5px; margin-bottom: 8px; box-sizing: border-box;
  }
  #new-project-box button {
    width: 100%; background: var(--accent); color: var(--bg); border: none; border-radius: 6px;
    padding: 7px; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  #new-project-box button:hover { opacity: 0.85; }
  #new-project-box button:disabled { opacity: 0.5; cursor: default; }
  #np-msg { font-size: 11.5px; margin-top: 8px; line-height: 1.5; }

  /* ---------- 中间主内容:主线/卡点/历史,给最大空间 ---------- */
  #main { flex: 1; overflow-y: auto; padding: 36px 44px; min-width: 0; }
  #empty { color: var(--muted); font-size: 14px; }
  h2 { margin: 0 0 20px; font-size: 24px; }

  .pending-box {
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; margin-bottom: 24px; font-size: 13px; color: var(--muted);
  }
  .pending-row { display: flex; align-items: center; justify-content: space-between; }
  #health-line { font-size: 11.5px; display: flex; gap: 14px; }
  #health-line .warn { color: var(--obstacle); }
  #sync-btn {
    background: transparent; color: var(--want); border: 1px solid var(--want); border-radius: 6px;
    padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  #sync-btn:hover { background: rgba(138,173,244,0.1); }
  #sync-btn:disabled { opacity: 0.5; cursor: default; }
  #live-dot { color: var(--node); font-size: 9px; animation: live-pulse 1.4s ease-in-out infinite; }
  @keyframes live-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 36px; align-items: start; }
  .summary-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 22px 24px; }
  .summary-card .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 14px; font-weight: 700; }
  .summary-card.want .label { color: var(--want); }
  .summary-card.obstacle .label { color: var(--obstacle); }
  .summary-card .empty { color: var(--muted); font-style: italic; font-size: 14px; }

  /* want:一段一段的特点总结 */
  .feature-item { margin-bottom: 16px; }
  .feature-item:last-child { margin-bottom: 0; }
  .feature-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .feature-label { font-size: 12.5px; font-weight: 700; color: var(--want); }
  .feature-content { font-size: 14.5px; line-height: 1.7; color: var(--text); }

  /* obstacle:堆积式列表,不需要每条都占一整段 */
  .pile-item {
    display: flex; align-items: baseline; gap: 8px; padding: 6px 0; font-size: 13.5px; line-height: 1.6;
    border-top: 1px dashed var(--border);
  }
  .pile-item:first-child { border-top: none; padding-top: 0; }
  .pile-label { font-weight: 700; color: var(--obstacle); flex-shrink: 0; }
  .pile-content { color: var(--text); flex: 1; min-width: 0; }

  /* 优先级标记:现在做/先放一边,纯用户手动打,AI不参与 */
  .priority-badge {
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; white-space: nowrap;
  }
  .priority-badge.now { color: var(--obstacle); background: rgba(237,135,150,0.15); }
  .priority-badge.later { color: var(--muted); background: rgba(255,255,255,0.06); }
  .priority-controls { display: inline-flex; gap: 4px; flex-shrink: 0; }
  .priority-btn {
    font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .priority-btn:hover { border-color: var(--accent); color: var(--text); }
  .priority-btn.active.now { border-color: var(--obstacle); color: var(--obstacle); }
  .priority-btn.active.later { border-color: var(--muted); color: var(--text); }
  .priority-reason { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 2px; }

  .show-inactive-toggle {
    display: inline-block; margin-top: 12px; font-size: 11.5px; color: var(--muted); cursor: pointer; text-decoration: underline;
  }
  .show-inactive-toggle:hover { color: var(--text); }
  .inactive-list { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: none; }
  .inactive-list.expanded { display: block; }

  h3.timeline-title { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 20px; font-weight: 700; }
  .threads-count { text-transform: none; font-weight: 500; letter-spacing: 0; color: var(--muted); }

  /* ---------- 关注线 ---------- */
  #threads-section { margin-bottom: 36px; }
  #threads-filter {
    width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; color: var(--text); font-size: 12.5px; margin-bottom: 10px; box-sizing: border-box;
  }
  #threads-filter:focus { outline: none; border-color: var(--accent); }
  #threads-list { max-height: 420px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
  #threads-empty { padding: 14px; font-size: 12.5px; color: var(--muted); font-style: italic; }
  .thread-row { border-bottom: 1px solid var(--border); }
  .thread-row:last-child { border-bottom: none; }
  .thread-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer;
  }
  .thread-head:hover { background: rgba(255,255,255,0.03); }
  .thread-type-badge {
    font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
  }
  .thread-type-badge.want { color: var(--want); background: rgba(138,173,244,0.12); }
  .thread-type-badge.obstacle { color: var(--obstacle); background: rgba(237,135,150,0.12); }
  .thread-type-badge.node { color: var(--node); background: rgba(166,218,149,0.12); }
  .thread-label { font-size: 13.5px; font-weight: 600; flex-shrink: 0; }
  .thread-status-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; font-weight: 600;
  }
  .thread-status-badge.resolved { color: var(--node); background: rgba(166,218,149,0.15); }
  .thread-status-badge.open { color: var(--muted); background: rgba(255,255,255,0.06); }
  .thread-status-badge.stalled { color: var(--obstacle); background: rgba(237,135,150,0.1); }
  .thread-preview { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .thread-count { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .thread-body { display: none; padding: 4px 14px 14px 40px; }
  .thread-body.expanded { display: block; }
  .thread-body-entry { font-size: 12.5px; line-height: 1.7; padding: 6px 0; border-top: 1px dashed var(--border); }
  .thread-body-entry:first-child { border-top: none; }
  .thread-body-ts { color: var(--muted); font-size: 11px; margin-right: 8px; }
  .thread-check-btn {
    margin-top: 8px; background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .thread-check-btn:hover { background: rgba(198,160,246,0.1); }
  .thread-check-btn:disabled { opacity: 0.5; cursor: default; }
  .thread-check-result {
    margin-top: 10px; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: none;
  }
  .timeline { position: relative; padding-left: 22px; }
  .timeline::before { content: ""; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
  .entry { position: relative; margin-bottom: 26px; }
  .entry::before {
    content: ""; position: absolute; left: -22px; top: 5px; width: 11px; height: 11px;
    border-radius: 50%; background: var(--bg); border: 2px solid var(--muted);
  }
  .entry.want::before { border-color: var(--want); }
  .entry.obstacle::before { border-color: var(--obstacle); }
  .entry.node::before { border-color: var(--node); background: var(--node); }
  .entry-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .entry-type { font-size: 11.5px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
  .entry.want .entry-type { color: var(--want); background: rgba(138,173,244,0.12); }
  .entry.obstacle .entry-type { color: var(--obstacle); background: rgba(237,135,150,0.12); }
  .entry.node .entry-type { color: var(--node); background: rgba(166,218,149,0.12); }
  .entry-ts { font-size: 11.5px; color: var(--muted); }
  .entry-content { font-size: 14.5px; line-height: 1.7; }
  .entry-reason { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* ---------- 右侧:复盘工具面板 ---------- */
  #report-panel {
    width: 340px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    padding: 20px;
  }
  #report-panel h1 { font-size: 14px; color: var(--muted); font-weight: 700; margin: 0 0 14px; letter-spacing: 0.5px; }
  .rp-path-row { margin-bottom: 14px; }
  .rp-path-row input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; color: var(--text); font-size: 12px; margin-bottom: 8px; box-sizing: border-box;
  }
  .rp-hook-row { display: flex; align-items: center; gap: 8px; }
  .hook-status { font-size: 11.5px; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
  .hook-status.attached { background: rgba(166,218,149,0.15); color: var(--node); }
  .hook-status.not-attached { background: rgba(237,135,150,0.12); color: var(--obstacle); }
  .hook-btn {
    background: transparent; color: var(--node); border: 1px solid var(--node); border-radius: 6px;
    padding: 4px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .hook-btn:hover { background: rgba(166,218,149,0.1); }
  .rp-error { color: var(--obstacle); font-size: 11.5px; margin-top: 6px; line-height: 1.5; }

  .rp-actions { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
  .rp-btn {
    border: none; border-radius: 6px; padding: 9px 12px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; text-align: left;
  }
  .rp-btn:disabled { opacity: 0.5; cursor: default; }
  .rp-btn.synth { background: var(--accent); color: var(--bg); }
  .rp-btn.drift { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .rp-btn.impl { background: transparent; color: var(--node); border: 1px solid var(--node); }

  .rp-current-result {
    font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 18px; max-height: 320px; overflow-y: auto;
  }
  .rp-current-result.loading { color: var(--muted); font-style: italic; }
  .rp-current-result strong { color: var(--accent); }

  .rp-history-title { font-size: 13px; color: var(--muted); font-weight: 700; margin: 18px 0 10px; border-top: 1px solid var(--border); padding-top: 16px; }
  .report-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .report-item-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .report-item-type { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
  .report-item-type.drift { color: var(--accent); background: rgba(198,160,246,0.12); }
  .report-item-type.implementation { color: var(--node); background: rgba(166,218,149,0.12); }
  .report-item-type.synthesis { color: var(--want); background: rgba(138,173,244,0.12); }
  .report-item-ts { font-size: 10.5px; color: var(--muted); }
  .report-item-note {
    width: 100%; background: transparent; border: none; color: var(--text); font-size: 12px;
    margin-top: 6px; padding: 2px 0; border-bottom: 1px dashed transparent;
  }
  .report-item-note:focus { border-bottom-color: var(--border); outline: none; }
  .report-item-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .report-item-actions button {
    background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 0;
  }
  .report-item-actions button:hover { color: var(--text); }
  .report-item-actions button.danger:hover { color: var(--obstacle); }
  .report-item-content {
    display: none; font-size: 12px; line-height: 1.6; white-space: pre-wrap; color: var(--muted);
    margin-top: 8px; max-height: 260px; overflow-y: auto;
  }
  .rp-empty { color: var(--muted); font-size: 12px; font-style: italic; }
</style>
</head>
<body>
  <div id="gate">
    <div id="gate-box">
      <div id="gate-title">罗盘</div>
      <div id="gate-hint">先填你当前在用的项目文件夹路径，接上实时监控之后再进入。</div>
      <input type="text" id="gate-path" placeholder="项目文件夹完整路径">
      <button id="gate-btn">进入</button>
      <div id="gate-msg"></div>
      <span id="gate-skip">先看看已有的话题，暂不接入</span>
    </div>
  </div>

  <div id="app-shell">
  <button id="sidebar-toggle" title="收起/展开话题栏">‹</button>
  <div id="sidebar">
    <div id="new-project-box">
      <div class="np-title">开始监控一个项目</div>
      <div class="np-hint">新项目/还没出现在下面列表里的项目，从这开始——话题会在真实对话发生后自动出现，不用先有话题才能接。</div>
      <input type="text" id="np-path" placeholder="项目文件夹完整路径">
      <button id="np-btn">接上实时监控</button>
      <div id="np-msg"></div>
    </div>
    <span id="switch-project">切换项目入口</span>
    <div id="filter-bar" style="display:none">
      <div id="filter-path"></div>
      <span id="show-all-topics">查看全部话题</span>
    </div>
    <h1>话题</h1>
    <div id="topic-list"></div>
    <div id="topic-list-empty" style="display:none"></div>
  </div>

  <div id="main">
    <div id="empty">从左边选一个话题看详情</div>
    <div id="detail" style="display:none">
      <h2 id="detail-title"></h2>

      <div id="pending-box" class="pending-box" style="display:none">
        <div class="pending-row">
          <span><span id="live-dot" style="display:none">●</span> <span id="pending-text"></span></span>
          <button id="sync-btn">立即同步</button>
        </div>
        <div id="health-line" style="display:none"></div>
      </div>

      <div class="summary-box">
        <div class="summary-card want">
          <div class="label">主线目标（各特点）</div>
          <div id="want-features"></div>
        </div>
        <div class="summary-card obstacle">
          <div class="label">当前卡点（堆积）</div>
          <div id="obstacle-pile"></div>
        </div>
      </div>

      <div id="threads-section" style="display:none">
        <h3 class="timeline-title">
          关注线 <span id="threads-count" class="threads-count"></span>
        </h3>
        <input type="text" id="threads-filter" placeholder="按线名/内容搜索…" style="display:none">
        <div id="threads-list"></div>
        <div id="threads-empty" style="display:none">没有匹配的关注线</div>
      </div>

      <h3 class="timeline-title">完整历史</h3>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <div id="report-panel" style="display:none">
    <h1>复盘工具</h1>
    <div class="rp-path-row">
      <input type="text" id="impl-path" placeholder="项目代码目录，比如 C:\Users\...\项目文件夹">
      <div class="rp-hook-row">
        <span id="hook-status" class="hook-status">检查中…</span>
        <button class="hook-btn" id="hook-btn">接上实时监控</button>
      </div>
      <div class="rp-error" id="rp-error" style="display:none"></div>
    </div>

    <div class="rp-actions">
      <button class="rp-btn synth" id="synth-btn">跑一次综合复盘</button>
      <button class="rp-btn drift" id="drift-btn">检查是否走偏</button>
      <button class="rp-btn impl" id="impl-btn">检查代码是否落地</button>
    </div>

    <div class="rp-current-result" id="rp-current-result" style="display:none"></div>

    <div class="rp-history-title">历史报告</div>
    <div id="report-list"></div>
  </div>
  </div>

<script>
let currentTopic = null;
let currentProjectFilter = null;

// 从资源管理器"复制为路径"粘贴过来的字符串两端总带着引号，这里统一清掉，不用每次手动删。
function sanitizePath(raw) {
  return (raw || '').trim().replace(/^["'“”‘’]+|["'“”‘’]+$/g, '').trim();
}

// ---------- 入口:先给项目文件夹路径,再进主界面 ----------
const LAST_PATH_KEY = 'compass_last_path';
const SIDEBAR_COLLAPSED_KEY = 'compass_sidebar_collapsed';

function showApp(projectPath) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
  currentProjectFilter = projectPath || null;
  updateFilterBar();
  loadTopics();
}

function updateFilterBar() {
  const bar = document.getElementById('filter-bar');
  if (currentProjectFilter) {
    bar.style.display = 'block';
    document.getElementById('filter-path').textContent = '当前项目：' + currentProjectFilter;
  } else {
    bar.style.display = 'none';
  }
}

document.getElementById('show-all-topics').onclick = () => {
  currentProjectFilter = null;
  updateFilterBar();
  loadTopics();
};

function showGate(prefillLast) {
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  const input = document.getElementById('gate-path');
  input.value = prefillLast ? (localStorage.getItem(LAST_PATH_KEY) || '') : '';
  document.getElementById('gate-msg').textContent = '';
  input.focus();
}

async function attachAndEnter(path) {
  const msg = document.getElementById('gate-msg');
  const btn = document.getElementById('gate-btn');
  btn.disabled = true;
  msg.style.color = '';
  msg.textContent = '接入中…';
  try {
    const res = await fetch('/api/attach_hook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_path: path }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || '接入失败';
      msg.style.color = 'var(--obstacle)';
      return;
    }
    localStorage.setItem(LAST_PATH_KEY, path);
    msg.style.color = 'var(--node)';
    msg.textContent = data.already_attached
      ? '这个项目之前已经接过了，正在为你筛选它的话题…'
      : '接入成功！之后在这个文件夹里新开一个Claude Code会话开始聊，话题会自动出现——已经开着的会话需要关掉重开才生效。';
    setTimeout(() => showApp(path), data.already_attached ? 500 : 1800);
  } catch (e) {
    msg.textContent = '接入失败：' + e;
    msg.style.color = 'var(--obstacle)';
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('gate-btn').onclick = () => {
  const path = sanitizePath(document.getElementById('gate-path').value);
  const msg = document.getElementById('gate-msg');
  if (!path) {
    msg.textContent = '先填项目文件夹路径';
    msg.style.color = 'var(--obstacle)';
    return;
  }
  attachAndEnter(path);
};
document.getElementById('gate-path').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('gate-btn').click();
});
document.getElementById('gate-skip').onclick = () => showApp();
document.getElementById('switch-project').onclick = () => showGate(true);

// ---------- 侧边栏折叠 ----------
function applySidebarCollapsed(collapsed) {
  document.getElementById('sidebar').classList.toggle('collapsed', collapsed);
  document.getElementById('sidebar-toggle').classList.toggle('collapsed-pos', collapsed);
  document.getElementById('sidebar-toggle').textContent = collapsed ? '›' : '‹';
}
document.getElementById('sidebar-toggle').onclick = () => {
  const collapsed = !document.getElementById('sidebar').classList.contains('collapsed');
  applySidebarCollapsed(collapsed);
  localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed ? '1' : '0');
};
applySidebarCollapsed(localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === '1');

document.getElementById('np-btn').onclick = async () => {
  const path = sanitizePath(document.getElementById('np-path').value);
  const msg = document.getElementById('np-msg');
  const btn = document.getElementById('np-btn');
  msg.style.color = '';
  if (!path) {
    msg.textContent = '先填项目文件夹路径';
    msg.style.color = 'var(--obstacle)';
    return;
  }
  btn.disabled = true;
  msg.textContent = '接入中…';
  try {
    const res = await fetch('/api/attach_hook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_path: path }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || '接入失败';
      msg.style.color = 'var(--obstacle)';
    } else if (data.already_attached) {
      msg.textContent = '之前已经接过了，配置没变。';
      msg.style.color = 'var(--node)';
    } else {
      msg.textContent = '接入成功！之后在这个文件夹里新开一个Claude Code会话开始聊，话题会自动出现在下面列表里。已经开着的会话需要关掉重开才生效。';
      msg.style.color = 'var(--node)';
    }
  } catch (e) {
    msg.textContent = '接入失败：' + e;
    msg.style.color = 'var(--obstacle)';
  } finally {
    btn.disabled = false;
  }
};

async function loadTopics() {
  const url = currentProjectFilter
    ? '/api/topics?project_path=' + encodeURIComponent(currentProjectFilter)
    : '/api/topics';
  const res = await fetch(url);
  const topics = await res.json();
  const list = document.getElementById('topic-list');
  const emptyEl = document.getElementById('topic-list-empty');
  list.innerHTML = '';
  if (currentProjectFilter && topics.length === 0) {
    emptyEl.style.display = 'block';
    emptyEl.textContent = '这个项目还没有话题记录。如果刚接入，新开一个Claude Code会话聊几轮，话题会自动出现；已经开着的旧会话需要关掉重开才能被监控到。';
    return;
  }
  emptyEl.style.display = 'none';
  topics.forEach(t => {
    const div = document.createElement('div');
    div.className = 'topic-item';
    div.dataset.name = t.name;
    div.innerHTML = `<div class="topic-name">${escapeHtml(t.name)}</div>
                      <div class="topic-meta">${t.record_count}条记录 · 最后更新 ${formatTs(t.last_ts)}</div>`;
    div.onclick = () => selectTopic(t.name, div);
    list.appendChild(div);
  });
}

async function selectTopic(name, el) {
  document.querySelectorAll('.topic-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('empty').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  document.getElementById('report-panel').style.display = 'block';
  document.getElementById('detail-title').textContent = name;
  currentTopic = name;

  const cur = document.getElementById('rp-current-result');
  cur.style.display = 'none';
  cur.innerHTML = '';
  document.getElementById('rp-error').style.display = 'none';

  await refreshTopicDetail(name, false);
  startAutoRefresh(name);
}

let autoRefreshTimer = null;
const AUTO_REFRESH_INTERVAL_MS = 20000; // 20秒轮一次,够快到有"实时"感,又不至于疯狂占用

function stopAutoRefresh() {
  if (autoRefreshTimer) {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
  }
  const dot = document.getElementById('live-dot');
  if (dot) dot.style.display = 'none';
}

function startAutoRefresh(name) {
  stopAutoRefresh();
  autoRefreshTimer = setInterval(() => autoRefreshTick(name), AUTO_REFRESH_INTERVAL_MS);
}

let autoRefreshBusy = false;

async function autoRefreshTick(name) {
  if (name !== currentTopic || autoRefreshBusy) return;
  autoRefreshBusy = true;
  const dot = document.getElementById('live-dot');
  if (dot) dot.style.display = 'inline-block';
  try {
    // sync本身很轻——没有攒够新检查点的话,不会真的调模型,可以放心频繁调用
    const res = await fetch('/api/topic/' + encodeURIComponent(name) + '/sync', { method: 'POST' });
    const data = await res.json();
    if (name !== currentTopic) return; // 轮询期间用户切了话题,结果作废
    if (data.processed_checkpoints > 0) {
      await refreshTopicDetail(name, true);
    } else {
      loadPending(name);
    }
  } catch (e) {
    // 自动轮询失败静默处理,不打扰用户,下一轮再试
  } finally {
    autoRefreshBusy = false;
  }
}

async function refreshTopicDetail(name, silent) {
  const res = await fetch('/api/topic/' + encodeURIComponent(name));
  const data = await res.json();
  if (!silent) {
    document.getElementById('impl-path').value = data.project_path || '';
    updateHookStatus(data.hook_attached);
    loadReports(name);
  }
  loadPending(name);

  renderSummary(name, data.threads || []);
  renderThreads(name, data.threads || []);

  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';
  data.history.slice().reverse().forEach(h => {
    const div = document.createElement('div');
    div.className = 'entry ' + h.record_type;
    const typeLabel = {want: '主线目标', obstacle: '当前卡点', node: '关键节点'}[h.record_type] || h.record_type;
    let html = `<div class="entry-header">
                  <span class="entry-type">${typeLabel}</span>
                  <span class="entry-ts">${formatTs(h.source_end_ts)}</span>
                </div>
                <div class="entry-content">${escapeHtml(h.content)}</div>`;
    if (h.reason) {
      html += `<div class="entry-reason">理由：${escapeHtml(h.reason)}</div>`;
    }
    div.innerHTML = html;
    timeline.appendChild(div);
  });
}

const TYPE_LABEL = {want: '主线目标', obstacle: '当前卡点', node: '关键节点'};

// ---------- 优先级标记:现在做/先放一边,纯用户手动打,AI不参与判断 ----------
// 复用在摘要卡片和关注线列表两个地方,所以抽成独立函数,不重复写交互逻辑。
function renderPriorityControls(container, topicName, thread) {
  const rt = thread.record_type;
  const label = thread.thread_label;
  const priorityUrl = '/api/topic/' + encodeURIComponent(topicName) + '/thread/' + encodeURIComponent(label)
    + '/priority?record_type=' + encodeURIComponent(rt);

  // 优先级同时展示在摘要卡片和关注线列表两个地方,是各自独立渲染的DOM，只改这里持有的
  // thread对象、只重渲这一个控件的话，另一处不会跟着变——所以改完直接触发一次完整的
  // refreshTopicDetail，让两处都从服务端最新状态重新渲染，不用自己维护"改了要通知谁"。
  async function setPriority(priority, reason) {
    await fetch(priorityUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ priority, reason: reason || '' }),
    });
    if (currentTopic) refreshTopicDetail(currentTopic, true);
  }
  async function clearPriority() {
    await fetch(priorityUrl, { method: 'DELETE' });
    if (currentTopic) refreshTopicDetail(currentTopic, true);
  }

  function render() {
    container.innerHTML = '';
    if (!thread.priority) {
      const nowBtn = document.createElement('button');
      nowBtn.className = 'priority-btn';
      nowBtn.textContent = '现在做';
      nowBtn.onclick = (e) => { e.stopPropagation(); setPriority('now', null); };
      const laterBtn = document.createElement('button');
      laterBtn.className = 'priority-btn';
      laterBtn.textContent = '先放一边';
      laterBtn.onclick = (e) => { e.stopPropagation(); setPriority('later', null); };
      container.appendChild(nowBtn);
      container.appendChild(laterBtn);
      return;
    }
    const badge = document.createElement('span');
    badge.className = 'priority-badge ' + thread.priority;
    badge.textContent = (thread.priority === 'now' ? '现在做' : '先放一边') + ' ✕';
    badge.title = '点击取消这个标记';
    badge.onclick = (e) => { e.stopPropagation(); clearPriority(); };
    container.appendChild(badge);
    if (thread.priority === 'later' && !thread.priority_reason) {
      const addReason = document.createElement('span');
      addReason.className = 'priority-btn';
      addReason.style.marginLeft = '4px';
      addReason.textContent = '+备注';
      addReason.onclick = (e) => {
        e.stopPropagation();
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '为什么先放一边…';
        input.style.cssText = 'font-size:11px;width:140px;margin-left:4px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--text);';
        input.onclick = (ev) => ev.stopPropagation();
        input.onkeydown = (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); setPriority('later', input.value.trim()); } };
        input.onblur = () => { if (input.value.trim()) setPriority('later', input.value.trim()); else render(); };
        container.appendChild(input);
        input.focus();
      };
      container.appendChild(addReason);
    }
    if (thread.priority_reason) {
      const reasonEl = document.createElement('div');
      reasonEl.className = 'priority-reason';
      reasonEl.textContent = thread.priority_reason;
      container.appendChild(reasonEl);
    }
  }
  render();
}

// ---------- 手动标记已解决:resolved原来只有AI在提取时看到对话明说"解决了"才会标，
// 大量真实完成是安静的、没人在对话里宣布，会一直卡在"进行中"，这里让用户自己纠正。
// 跟优先级控件一样复用在摘要卡片和关注线列表两处，改完也是触发完整刷新保证两处同步。
function renderStatusToggle(container, topicName, thread) {
  const rt = thread.record_type;
  const label = thread.thread_label;
  const statusUrl = '/api/topic/' + encodeURIComponent(topicName) + '/thread/' + encodeURIComponent(label)
    + '/status?record_type=' + encodeURIComponent(rt);

  async function setStatus(status) {
    await fetch(statusUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    if (currentTopic) refreshTopicDetail(currentTopic, true);
  }

  function render() {
    container.innerHTML = '';
    const isResolved = thread.thread_status === 'resolved';
    const badge = document.createElement('span');
    badge.className = 'thread-status-badge ' + (isResolved ? 'resolved' : (thread.stalled ? 'stalled' : 'open'));
    badge.textContent = isResolved ? '已解决' : (thread.stalled ? '已搁置' : '进行中');
    container.appendChild(badge);

    const actionBtn = document.createElement('span');
    actionBtn.className = 'priority-btn';
    actionBtn.style.marginLeft = '4px';
    actionBtn.textContent = isResolved ? '撤销' : '标记已解决';
    actionBtn.onclick = (e) => { e.stopPropagation(); setStatus(isResolved ? 'open' : 'resolved'); };
    container.appendChild(actionBtn);
  }
  render();
}

// ---------- 摘要卡片:want是"一段一段的特点总结",obstacle是"堆积式列表" ----------
// 只展示"进行中"(非resolved、非搁置)的线,避免摘要区变成又一个完整历史列表；
// resolved/stalled的折叠在"查看已解决/已搁置"里,默认收起。
function renderSummary(topicName, threads) {
  const wantThreads = threads.filter(t => t.record_type === 'want');
  const obstacleThreads = threads.filter(t => t.record_type === 'obstacle');
  renderFeatureList(document.getElementById('want-features'), topicName, wantThreads);
  renderPileList(document.getElementById('obstacle-pile'), topicName, obstacleThreads);
}

function splitActiveInactive(threads) {
  const active = threads.filter(t => t.thread_status !== 'resolved' && !t.stalled);
  const inactive = threads.filter(t => t.thread_status === 'resolved' || t.stalled);
  return { active, inactive };
}

function inactiveToggle(container, inactive, buildItem) {
  if (!inactive.length) return;
  const toggle = document.createElement('span');
  toggle.className = 'show-inactive-toggle';
  toggle.textContent = `查看已解决/已搁置的（${inactive.length}条）`;
  const list = document.createElement('div');
  list.className = 'inactive-list';
  inactive.forEach(t => list.appendChild(buildItem(t)));
  toggle.onclick = () => {
    list.classList.toggle('expanded');
    toggle.textContent = list.classList.contains('expanded')
      ? '收起已解决/已搁置的'
      : `查看已解决/已搁置的（${inactive.length}条）`;
  };
  container.appendChild(toggle);
  container.appendChild(list);
}

function buildFeatureItem(topicName, t) {
  const item = document.createElement('div');
  item.className = 'feature-item';
  const head = document.createElement('div');
  head.className = 'feature-head';
  const labelEl = document.createElement('span');
  labelEl.className = 'feature-label';
  labelEl.textContent = t.thread_label;
  const statusCtrl = document.createElement('span');
  const ctrl = document.createElement('span');
  ctrl.className = 'priority-controls';
  head.appendChild(labelEl);
  head.appendChild(statusCtrl);
  head.appendChild(ctrl);
  const content = document.createElement('div');
  content.className = 'feature-content';
  content.textContent = t.content;
  item.appendChild(head);
  item.appendChild(content);
  renderStatusToggle(statusCtrl, topicName, t);
  renderPriorityControls(ctrl, topicName, t);
  return item;
}

function renderFeatureList(container, topicName, threads) {
  container.innerHTML = '';
  if (!threads.length) {
    container.innerHTML = '<span class="empty">（无记录）</span>';
    return;
  }
  const { active, inactive } = splitActiveInactive(threads);
  if (!active.length) {
    container.innerHTML = '<span class="empty">（当前没有进行中的特点）</span>';
  } else {
    active.forEach(t => container.appendChild(buildFeatureItem(topicName, t)));
  }
  inactiveToggle(container, inactive, (t) => buildFeatureItem(topicName, t));
}

function buildPileItem(topicName, t) {
  const item = document.createElement('div');
  item.className = 'pile-item';
  const labelEl = document.createElement('span');
  labelEl.className = 'pile-label';
  labelEl.textContent = t.thread_label + '：';
  const contentEl = document.createElement('span');
  contentEl.className = 'pile-content';
  contentEl.textContent = t.content;
  const statusCtrl = document.createElement('span');
  const ctrl = document.createElement('span');
  ctrl.className = 'priority-controls';
  item.appendChild(labelEl);
  item.appendChild(contentEl);
  item.appendChild(statusCtrl);
  item.appendChild(ctrl);
  renderStatusToggle(statusCtrl, topicName, t);
  renderPriorityControls(ctrl, topicName, t);
  return item;
}

function renderPileList(container, topicName, threads) {
  container.innerHTML = '';
  if (!threads.length) {
    container.innerHTML = '<span class="empty">（无记录）</span>';
    return;
  }
  const { active, inactive } = splitActiveInactive(threads);
  if (!active.length) {
    container.innerHTML = '<span class="empty">（当前没有进行中的卡点）</span>';
  } else {
    active.forEach(t => container.appendChild(buildPileItem(topicName, t)));
  }
  inactiveToggle(container, inactive, (t) => buildPileItem(topicName, t));
}
const THREADS_FILTER_THRESHOLD = 15; // 线数超过这个才显示搜索框，少的话滚动一下就看完了，不用额外UI
let currentThreads = [];
let currentThreadsTopic = null;

function renderThreads(topicName, threads) {
  currentThreads = threads;
  currentThreadsTopic = topicName;
  const section = document.getElementById('threads-section');
  const filterInput = document.getElementById('threads-filter');

  if (!threads.length) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  filterInput.style.display = threads.length > THREADS_FILTER_THRESHOLD ? 'block' : 'none';
  filterInput.value = '';
  renderThreadRows(topicName, threads);
}

function renderThreadRows(topicName, threads) {
  const countEl = document.getElementById('threads-count');
  const list = document.getElementById('threads-list');
  const emptyEl = document.getElementById('threads-empty');
  list.innerHTML = '';
  countEl.textContent = `(${threads.length}/${currentThreads.length}条)`;

  if (!threads.length) {
    list.style.display = 'none';
    emptyEl.style.display = 'block';
    return;
  }
  list.style.display = 'block';
  emptyEl.style.display = 'none';

  threads.forEach(t => {
    const row = document.createElement('div');
    row.className = 'thread-row';
    row.innerHTML = `
      <div class="thread-head">
        <span class="thread-type-badge ${t.record_type}">${TYPE_LABEL[t.record_type] || t.record_type}</span>
        <span class="thread-label">${escapeHtml(t.thread_label)}</span>
        <span class="thread-status-toggle"></span>
        <span class="priority-controls thread-priority-controls"></span>
        <span class="thread-preview">${escapeHtml(t.content)}</span>
        <span class="thread-count">${t.record_count}条 · ${formatTs(t.source_end_ts)}</span>
      </div>
      <div class="thread-body"></div>
    `;
    const head = row.querySelector('.thread-head');
    const body = row.querySelector('.thread-body');
    const statusCtrl = row.querySelector('.thread-status-toggle');
    const priorityCtrl = row.querySelector('.thread-priority-controls');
    renderStatusToggle(statusCtrl, topicName, t);
    renderPriorityControls(priorityCtrl, topicName, t);
    head.onclick = () => toggleThread(topicName, t, body);
    list.appendChild(row);
  });
}

document.getElementById('threads-filter').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = q
    ? currentThreads.filter(t => t.thread_label.toLowerCase().includes(q) || t.content.toLowerCase().includes(q))
    : currentThreads;
  renderThreadRows(currentThreadsTopic, filtered);
});

async function toggleThread(topicName, thread, bodyEl) {
  const expanded = bodyEl.classList.contains('expanded');
  if (expanded) {
    bodyEl.classList.remove('expanded');
    return;
  }
  bodyEl.classList.add('expanded');
  if (bodyEl.dataset.loaded) return;
  bodyEl.dataset.loaded = '1';

  bodyEl.innerHTML = '<div class="thread-body-entry">加载中…</div>';
  const url = '/api/topic/' + encodeURIComponent(topicName) + '/thread/' + encodeURIComponent(thread.thread_label)
    + '?record_type=' + encodeURIComponent(thread.record_type);
  const res = await fetch(url);
  const history = await res.json();

  bodyEl.innerHTML = '';
  history.forEach(h => {
    const entry = document.createElement('div');
    entry.className = 'thread-body-entry';
    entry.innerHTML = `<span class="thread-body-ts">${formatTs(h.source_end_ts)}</span>${escapeHtml(h.content)}`
      + (h.reason ? `<div class="entry-reason">理由：${escapeHtml(h.reason)}</div>` : '');
    bodyEl.appendChild(entry);
  });

  const checkBtn = document.createElement('button');
  checkBtn.className = 'thread-check-btn';
  checkBtn.textContent = '检查这条线有没有矛盾';
  const resultEl = document.createElement('div');
  resultEl.className = 'thread-check-result';
  checkBtn.onclick = async () => {
    checkBtn.disabled = true;
    resultEl.style.display = 'block';
    resultEl.textContent = '正在读这条线的完整历史做判断……';
    try {
      const checkUrl = '/api/topic/' + encodeURIComponent(topicName) + '/thread/' + encodeURIComponent(thread.thread_label)
        + '/drift?record_type=' + encodeURIComponent(thread.record_type);
      const r = await fetch(checkUrl, { method: 'POST' });
      const data = await r.json();
      resultEl.textContent = r.ok ? data.result : (data.error || '失败');
    } catch (e) {
      resultEl.textContent = '失败：' + e;
    } finally {
      checkBtn.disabled = false;
    }
  };
  bodyEl.appendChild(checkBtn);
  bodyEl.appendChild(resultEl);
}

async function loadPending(name) {
  const box = document.getElementById('pending-box');
  const pendingRow = document.querySelector('#pending-box .pending-row');
  const text = document.getElementById('pending-text');
  const healthLine = document.getElementById('health-line');
  const res = await fetch('/api/topic/' + encodeURIComponent(name) + '/pending');
  const data = await res.json();

  if (data.available) {
    pendingRow.style.display = 'flex';
    if (data.new_user_turns === 0 && data.new_edits === 0) {
      text.textContent = '已经是最新的，没有待同步的内容';
    } else {
      text.textContent = `自上次同步以来：${data.new_user_turns}条新消息，${data.new_edits}次代码改动`;
    }
  } else {
    pendingRow.style.display = 'none';
  }

  const parts = [];
  if (data.recent_failure_count > 0) {
    parts.push(`<span class="warn">最近24小时提取失败${data.recent_failure_count}次${data.last_failure ? '（最近一次：' + escapeHtml(data.last_failure.error.slice(0, 40)) + '…）' : ''}</span>`);
  }
  if (data.hook_last_seen) {
    parts.push(`Hook上次活跃：${formatTs(data.hook_last_seen)}`);
  }
  if (parts.length) {
    healthLine.innerHTML = parts.join('');
    healthLine.style.display = 'flex';
  } else {
    healthLine.style.display = 'none';
  }

  box.style.display = (data.available || parts.length) ? 'flex' : 'none';
}

document.getElementById('sync-btn').onclick = async () => {
  if (!currentTopic) return;
  const btn = document.getElementById('sync-btn');
  const text = document.getElementById('pending-text');
  btn.disabled = true;
  text.textContent = '同步中……';
  try {
    const res = await fetch('/api/topic/' + encodeURIComponent(currentTopic) + '/sync', { method: 'POST' });
    const data = await res.json();
    text.textContent = `同步完成，处理了${data.processed_checkpoints}个新检查点`;
    const el = document.querySelector('.topic-item[data-name="' + currentTopic.replace(/"/g, '\\"') + '"]');
    if (el) selectTopic(currentTopic, el);
  } catch (e) {
    text.textContent = '同步失败：' + e;
  } finally {
    btn.disabled = false;
  }
};

function updateHookStatus(attached) {
  const el = document.getElementById('hook-status');
  if (attached) {
    el.textContent = '● 已接入';
    el.className = 'hook-status attached';
  } else {
    el.textContent = '○ 未接入';
    el.className = 'hook-status not-attached';
  }
}

document.getElementById('hook-btn').onclick = async () => {
  if (!currentTopic) return;
  const path = sanitizePath(document.getElementById('impl-path').value);
  const errorEl = document.getElementById('rp-error');
  errorEl.style.display = 'none';
  if (!path) {
    errorEl.textContent = '先填一下项目代码目录的路径';
    errorEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('hook-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/topic/' + encodeURIComponent(currentTopic) + '/attach_hook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_path: path }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || '接入失败';
      errorEl.style.display = 'block';
    } else {
      updateHookStatus(true);
      errorEl.textContent = data.already_attached
        ? '之前已经接过了，配置没变。'
        : ('接入成功！已写入 ' + data.settings_path + '——已经开着的Claude Code会话需要关掉重开才会生效。');
      errorEl.style.color = 'var(--node)';
      errorEl.style.display = 'block';
    }
  } catch (e) {
    errorEl.textContent = '接入失败：' + e;
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
};

async function runReport(kind) {
  if (!currentTopic) return;
  const path = sanitizePath(document.getElementById('impl-path').value);
  const errorEl = document.getElementById('rp-error');
  const result = document.getElementById('rp-current-result');
  errorEl.style.display = 'none';

  const needsPath = kind !== 'drift';
  if (needsPath && !path) {
    errorEl.textContent = '先填一下项目代码目录的路径';
    errorEl.style.display = 'block';
    return;
  }

  const btns = ['synth-btn', 'drift-btn', 'impl-btn'].map(id => document.getElementById(id));
  btns.forEach(b => b.disabled = true);
  result.style.display = 'block';
  result.className = 'rp-current-result loading';
  result.textContent = kind === 'synthesis'
    ? '正在依次跑漂移检测、代码落地检测，最后做交叉核对，三次调用，会比较久……'
    : kind === 'drift'
    ? '正在读完整个话题的历史做判断……'
    : '正在读全部决定和源码/diff做比对……';

  const urlMap = { synthesis: 'synthesis', drift: 'drift', implementation: 'implementation' };
  try {
    const res = await fetch('/api/topic/' + encodeURIComponent(currentTopic) + '/' + urlMap[kind], {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_path: path }),
    });
    const data = await res.json();
    if (!res.ok) {
      result.style.display = 'none';
      errorEl.textContent = data.error || '失败';
      errorEl.style.display = 'block';
    } else {
      result.className = 'rp-current-result';
      result.innerHTML = simpleMarkdown(kind === 'synthesis' ? data.synthesis : data.result);
      loadReports(currentTopic);
    }
  } catch (e) {
    result.style.display = 'none';
    errorEl.textContent = '失败：' + e;
    errorEl.style.display = 'block';
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

document.getElementById('synth-btn').onclick = () => runReport('synthesis');
document.getElementById('drift-btn').onclick = () => runReport('drift');
document.getElementById('impl-btn').onclick = () => runReport('implementation');

const REPORT_TYPE_LABEL = { drift: '漂移检测', implementation: '代码落地', synthesis: '综合复盘' };

async function loadReports(name) {
  const list = document.getElementById('report-list');
  const res = await fetch('/api/topic/' + encodeURIComponent(name) + '/reports');
  const reportsData = await res.json();
  list.innerHTML = '';
  if (!reportsData.length) {
    list.innerHTML = '<div class="rp-empty">还没有保存过报告</div>';
    return;
  }
  reportsData.forEach(r => {
    const item = document.createElement('div');
    item.className = 'report-item';
    item.innerHTML = `
      <div class="report-item-head">
        <span class="report-item-type ${r.report_type}">${REPORT_TYPE_LABEL[r.report_type] || r.report_type}</span>
        <span class="report-item-ts">${formatTs(r.created_at)}</span>
      </div>
      <input class="report-item-note" placeholder="加个备注/名字…" value="${escapeAttr(r.note || '')}">
      <div class="report-item-content"></div>
      <div class="report-item-actions">
        <button class="view-btn">查看</button>
        <button class="danger delete-btn">删除</button>
      </div>
    `;
    const noteInput = item.querySelector('.report-item-note');
    noteInput.onchange = async () => {
      await fetch('/api/reports/' + r.id + '/note', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note: noteInput.value }),
      });
    };
    const contentDiv = item.querySelector('.report-item-content');
    const viewBtn = item.querySelector('.view-btn');
    viewBtn.onclick = async () => {
      const showing = contentDiv.style.display === 'block';
      if (showing) {
        contentDiv.style.display = 'none';
        viewBtn.textContent = '查看';
        return;
      }
      if (!contentDiv.dataset.loaded) {
        const cres = await fetch('/api/reports/' + r.id);
        const cdata = await cres.json();
        contentDiv.textContent = cdata.content || '（读取失败）';
        contentDiv.dataset.loaded = '1';
      }
      contentDiv.style.display = 'block';
      viewBtn.textContent = '收起';
    };
    item.querySelector('.delete-btn').onclick = async () => {
      await fetch('/api/reports/' + r.id, { method: 'DELETE' });
      loadReports(name);
    };
    list.appendChild(item);
  });
}

function simpleMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/^### (.+)$/gm, '<strong>$1</strong>');
  html = html.replace(/^## (.+)$/gm, '<strong style="font-size:15px">$1</strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return html;
}

function formatTs(ts) {
  if (!ts) return '';
  return ts.replace('T', ' ').replace('Z', '').slice(0, 16);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, '&quot;');
}

// 记得住上次填过的路径就直接进,不用每次都重新输入;第一次用/换过项目才会看到入口。
const rememberedPath = localStorage.getItem(LAST_PATH_KEY);
if (rememberedPath) {
  showApp(rememberedPath);
} else {
  showGate(false);
}
</script>
